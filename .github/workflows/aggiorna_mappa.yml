name: Aggiorna Mappa Funghi Server

on:
  schedule:
    # Esegue ogni giorno alle 05:00 UTC (06:00/07:00 ora italiana)
    - cron: '0 5 * * *'
  workflow_dispatch: # Permette anche l'esecuzione manuale dal browser

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configura Python su Server Remoto
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install folium requests

      - name: Calcola e Genera Mappa
        run: python genera_mappa.py

      - name: Salva e Pubblica i Risultati su GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update mappa funghi [skip ci]" || exit 0
          git push
